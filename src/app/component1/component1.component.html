<div class="right" *ngIf="demo">
  <section>
    <table id="table">
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>College</th>
      </tr>

      <tr
        *ngFor="let d of demo | async; let i = index"
        (click)="removeFromTable(i)"
      >
        <td>
          {{ d.name }}
        </td>
        <td>
          {{ d.age }}
        </td>
        <td>
          {{ d.college }}
        </td>
      </tr>
    </table>
  </section>
</div>
